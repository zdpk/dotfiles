# GeistMono Nerd Font — the same face WezTerm uses, so both terminals match.
#
# Each font-family line appends to a fallback chain; a comma-separated list on
# one line is read as a single family name and silently falls back to Ghostty's
# built-in font instead, so the Korean face gets its own line.
font-family = "GeistMono Nerd Font"
font-family = "Apple SD Gothic Neo"

# Geist Mono runs a little smaller than FiraCode at the same point size. Set a
# size here to compensate; the include in config comes last, so this wins.
# font-size = 18
